name: Publicar no Instagram

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3, então isto cobre 9h–18h de Brasília.
    - cron: '12 12 * * *'   #  9h12
    - cron: '47 13 * * *'   # 10h47
    - cron: '23 15 * * *'   # 12h23
    - cron: '08 16 * * *'   # 13h08
    - cron: '51 17 * * *'   # 14h51
    - cron: '34 18 * * *'   # 15h34
    - cron: '19 20 * * *'   # 17h19
    - cron: '58 20 * * *'   # 17h58
  workflow_dispatch:        # permite rodar na mão pelo site do GitHub

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Publicar 1 post
        id: publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python3 publicar.py --quantidade 1 --ignorar-horario 2>&1 | tee saida.txt

      - name: Salvar o progresso
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add publicados.json log.txt
          git diff --staged --quiet || git commit -m "Publicado no Instagram [skip ci]"
          git push

      - name: Avisar se deu erro
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ Falha ao publicar no Instagram — $(date +%d/%m\ %H:%M)" \
            --body "A publicação automática falhou e **parou por segurança**. Nada mais será publicado até isto ser resolvido.

          **Log do erro:**
          \`\`\`
          $(tail -25 saida.txt 2>/dev/null || echo 'sem saída registrada')
          \`\`\`

          [Ver a execução completa](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          **Causas mais comuns:**
          - Token do Instagram expirou (validade de 60 dias) → gerar outro e atualizar o secret \`IG_TOKEN\`
          - Limite diário da Meta atingido (100 posts/dia) → passa sozinho no dia seguinte
          - Instabilidade da API da Meta → normalmente resolve na próxima execução

          Para retomar depois de resolver: **Actions → Publicar no Instagram → Run workflow**."

      - name: Avisar quando terminar tudo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "Nada na fila" saida.txt 2>/dev/null; then
            gh issue create \
              --title "✅ Migração concluída: todos os posts foram publicados" \
              --body "A fila acabou. Todos os posts marcados já estão no Instagram.

          Pode desativar o agendamento em **Actions → Publicar no Instagram → ⋯ → Disable workflow**."
          fi
